<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest Expert - L'art de l'investissement</title>
    <style>
        /* Styles de base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
        }

        /* En-tête */
        header {
            background: #2c3e50;
            color: #fff;
            padding: 2rem 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #27ae60;
        }

        /* Conteneur principal */
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Section Contenu */
        section {
            margin-bottom: 2rem;
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 0.5rem;
        }

        .highlight {
            background: #e8f5e9;
            padding: 1rem;
            border-left: 5px solid #27ae60;
            font-style: italic;
        }

        /* Pied de page */
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        /* Bouton de contact */
        .btn {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Invest Expert</h1>
        <p>Maîtrisez votre avenir financier</p>
